# Dependabot: a pull request when a dependency has a newer release - CI tests
# it before anything is merged. Security fixes come as they're published;
# ordinary updates weekly, grouped so they arrive as one pull request.
version: 2
updates:
  - package-ecosystem: pip          # requirements.in and the requirements.txt pip-compile makes of it, together
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker       # the app image's base (Dockerfile)
    directory: /
    schedule:
      interval: weekly
    ignore:   # Python 3.12 on purpose (the dev venv, the CLI .exe, the pins): a new Python is a decision, not a bump
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker       # nginx's image
    directory: /deploy/nginx
    schedule:
      interval: weekly
    ignore:   # nginx's even minors are stable (1.30), odd ones mainline (1.31): stay on stable, take its patches
      - dependency-name: nginx
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
