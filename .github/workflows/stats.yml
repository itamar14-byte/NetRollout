# Download counts, daily: every release file's downloads (GitHub keeps only a
# running total per file) and each image's Docker Hub pulls, appended as dated
# rows to downloads.csv on the `stats` branch - so the history is kept. The
# counts include upgrades (NetRollout Manager and the Linux upgrade download the
# same files): copies fetched, not new users. Runnable by hand too.
# And the repository's traffic (views, clones, referrers, popular pages) into
# traffic.csv - GitHub keeps only 14 days of it. That needs the secret
# TRAFFIC_TOKEN: a fine-grained token for this repository only with
# Administration: Read-only (the workflow's own token can't read traffic);
# without it the traffic is skipped and the download counts still run.
name: Download stats

on:
  schedule:
    - cron: "17 3 * * *"     # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write            # the stats branch

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  count:
    name: Count downloads
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The stats branch (made on the first run)
        run: |
          if git ls-remote --exit-code --heads origin stats >/dev/null; then
            git switch -q -c stats origin/stats
          else
            git switch -q --orphan stats      # an empty branch: no files from master
          fi
          printf '%s\n' \
            "# NetRollout download counts" "" \
            "\`downloads.csv\`, a row per day and file, added by \`.github/workflows/stats.yml\` on master:" "" \
            "- \`date\`: the day counted (UTC)" \
            "- \`source\`: \`github\` (a release file's downloads) or \`dockerhub\` (an image's pulls)" \
            "- \`name\`: \`<tag>/<file>\`, or the image" \
            "- \`count\`: the running total that day - a day's downloads are the difference from the day before" "" \
            "The counts include upgrades (NetRollout Manager and the Linux upgrade download the same files)." "" \
            "\`traffic.csv\`, the repository's traffic from GitHub (it keeps only the last 14 days, so the history is here):" "" \
            "- \`date\`: for \`views\` / \`clones\`, the day measured (UTC; the last days are refreshed on every run); for \`referrer\` / \`path\`, the day fetched" \
            "- \`metric\`: \`views\` (the repository's pages), \`clones\` (git clones), \`referrer\` (the sites people came from), \`path\` (the pages viewed most)" \
            "- \`name\`: the referrer or the path; empty for views and clones" \
            "- \`count\`, \`uniques\`: that day's total and distinct visitors; for referrers and paths, the 14 days before the fetch" "" \
            "Clones include CI's own checkouts (every workflow run clones the repository), so \`views\` uniques are the better measure of people." > README.md
      - name: Count
        env:
          GH_TOKEN: ${{ github.token }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import csv, datetime, json, os, urllib.error, urllib.request

          def get(url, token=None):
              headers = {"Accept": "application/json", "User-Agent": "netrollout-stats"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as r:
                  return json.load(r)

          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          rows = []
          page = 1
          while True:      # every release's files
              releases = get(f"https://api.github.com/repos/{os.environ['REPO']}/releases"
                             f"?per_page=100&page={page}", os.environ["GH_TOKEN"])
              for release in releases:
                  for asset in release["assets"]:
                      rows.append((today, "github", f"{release['tag_name']}/{asset['name']}",
                                   asset["download_count"]))
              if len(releases) < 100:
                  break
              page += 1
          for image in ("netrollout", "netrollout-nginx"):   # Docker Hub pulls
              try:
                  data = get(f"https://hub.docker.com/v2/repositories/itamarweinstein/{image}/")
                  rows.append((today, "dockerhub", f"itamarweinstein/{image}", data["pull_count"]))
              except urllib.error.HTTPError as e:
                  print(f"{image}: not on Docker Hub yet ({e.code})")

          kept = []        # a rerun the same day replaces that day's rows
          if os.path.exists("downloads.csv"):
              with open("downloads.csv", newline="", encoding="utf-8") as f:
                  kept = [r for r in csv.reader(f)][1:]
              kept = [r for r in kept if r and r[0] != today]
          with open("downloads.csv", "w", newline="", encoding="utf-8") as f:
              out = csv.writer(f)
              out.writerow(["date", "source", "name", "count"])
              out.writerows(kept + [list(r) for r in rows])
          for r in rows:
              print(*r)
          print(f"{len(rows)} counts for {today}")

          # Traffic: GitHub keeps 14 days and needs a token with the repository's
          # Administration (read) permission, which the workflow's own token can't have.
          token = os.environ.get("TRAFFIC_TOKEN")
          if not token:
              print("traffic: skipped - no TRAFFIC_TOKEN secret")
              raise SystemExit(0)
          base = f"https://api.github.com/repos/{os.environ['REPO']}/traffic"
          traffic = {}     # (date, metric, name) -> (count, uniques)
          for metric in ("views", "clones"):
              for day in get(f"{base}/{metric}?per=day", token)[metric]:
                  traffic[(day["timestamp"][:10], metric, "")] = (day["count"], day["uniques"])
          for r in get(f"{base}/popular/referrers", token):
              traffic[(today, "referrer", r["referrer"])] = (r["count"], r["uniques"])
          for p in get(f"{base}/popular/paths", token):
              traffic[(today, "path", p["path"])] = (p["count"], p["uniques"])

          old = {}
          if os.path.exists("traffic.csv"):
              with open("traffic.csv", newline="", encoding="utf-8") as f:
                  for r in list(csv.reader(f))[1:]:
                      if r:
                          old[(r[0], r[1], r[2])] = (r[3], r[4])
          # A day GitHub still reports replaces the stored one (its last days fill in
          # later); a referrer / path fetch of the same day replaces that day's.
          fetched = {(d, m) for d, m, _ in traffic}
          old = {k: v for k, v in old.items() if (k[0], k[1]) not in fetched}
          old.update(traffic)
          with open("traffic.csv", "w", newline="", encoding="utf-8") as f:
              out = csv.writer(f)
              out.writerow(["date", "metric", "name", "count", "uniques"])
              out.writerows([*k, *v] for k, v in sorted(old.items()))
          for k, v in sorted(traffic.items()):
              print(*k, *v)
          print(f"{len(traffic)} traffic rows")
          EOF
      - name: Commit to the stats branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md downloads.csv $(ls traffic.csv 2>/dev/null)
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "Download counts $(date -u +%F)"
          git push -q origin stats
