# The project's site on GitHub Pages: the landing page (website/) at the root
# and the documentation (docs/*.md, built by MkDocs - mkdocs.yml) under /docs/.
# Published when either changes on master; a pull request that changes them
# is built (strict: a broken link or anchor fails it) but not published. The
# landing page reads the newest release from GitHub's API when it's opened,
# so a release needs no rebuild.
name: Site

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "website/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:              # the same list as push (actionlint refuses YAML anchors here)
      - "docs/**"
      - "website/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install MkDocs (requirements-docs.txt)
        run: python -m pip install -r requirements-docs.txt
      - name: Build the documentation (strict)
        run: mkdocs build --strict
      - name: Put the landing page at the root
        run: cp -r website/index.html website/assets build/site/
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
