# Every push and pull request: the test suite, the type gate, the migrations
# against the models, the scripts' linters and the Manager's build.
name: CI

on:
  push:            # every branch: green before it is merged (a tag starts the Release workflow, which runs these itself)
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:   # the Release workflow runs the same checks on the tagged commit
    inputs:
      skip_e2e:    # the release runs the end-to-end checks itself, on the images it publishes
        type: boolean
        default: false

permissions:
  contents: read

concurrency:   # a newer push to the same branch cancels the older run (named per calling workflow: a release never cancels its own checks)
  group: ${{ github.workflow }}-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_PG_ADMIN_URL: postgresql+psycopg2://postgres:ci-postgres@127.0.0.1:5432/postgres
      # with a password, as every install's Redis has one (tests rely on it)
      TEST_REDIS_URL: redis://:ci-redis@127.0.0.1:6379/15
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install (the image's exact pins, then the dev tools)
        run: pip install -r requirements-dev.txt
      - name: Type gate (mypy)
        run: python -m mypy
      - name: The migrations match the models (alembic check)
        working-directory: src/db
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:ci-postgres@127.0.0.1:5432/postgres
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
      - name: The LDAP tests' image
        run: docker pull alpine:latest
      - name: Redis, with a password (a service container can't be given one)
        run: |
          docker run -d --name ci-redis -p 6379:6379 redis:8.6-alpine redis-server --requirepass ci-redis
          for i in $(seq 1 30); do
            docker exec ci-redis redis-cli -a ci-redis --no-auth-warning ping | grep -q PONG && exit 0
            sleep 1
          done
          echo "Redis didn't start"; exit 1
      - name: Tests (unit + integration)
        run: python -m pytest -p no:cacheprovider

  # A whole install from the release's files and the images by tag, checked
  # from outside (tests/e2e). Informative: it reports, never fails the run,
  # and isn't required by the branch protection.
  e2e:
    name: End-to-end (informative)
    if: ${{ !inputs.skip_e2e }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      NETROLLOUT_E2E: "1"
      NETROLLOUT_E2E_TAG: e2e-local
      NETROLLOUT_E2E_KEEP: "1"   # the containers and the folder, for the logs below
      NETROLLOUT_E2E_DIR: /tmp/netrollout-e2e   # (the runner context is not available here)
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install (pytest; the checks run on the host)
        run: pip install -r requirements-dev.txt
      - name: Build the images (the tag an install names)
        run: |
          docker build -t "itamarweinstein/netrollout:$NETROLLOUT_E2E_TAG" .
          docker build -t "itamarweinstein/netrollout-nginx:$NETROLLOUT_E2E_TAG" deploy/nginx
      - name: End-to-end checks
        run: python -m pytest tests/e2e -p no:cacheprovider
      - name: On a failure - the services and their logs
        if: failure()
        working-directory: ${{ env.NETROLLOUT_E2E_DIR }}
        run: |
          docker compose -p nre2e ps --all || true
          for service in $(docker compose -p nre2e config --services); do
            echo "::group::$service"
            docker compose -p nre2e logs --no-color --tail 300 "$service" || true
            echo "::endgroup::"
          done
          sudo cat config/nginx/status.json || true
      - name: Clean up
        if: always()
        run: |
          if [ -d "$NETROLLOUT_E2E_DIR" ]; then
            (cd "$NETROLLOUT_E2E_DIR" && docker compose -p nre2e down -v --remove-orphans) || true
            sudo rm -rf "$NETROLLOUT_E2E_DIR"
          fi

  scripts:
    name: Shell scripts (ShellCheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck (preinstalled on the runner)
        run: |
          shellcheck --version
          shellcheck packaging/linux/*.sh deploy/initdb/*.sh deploy/nginx/*.sh

  windows:
    name: Windows (unit tests, PSScriptAnalyzer, the Manager's build)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Unit tests (hermetic - the dev PC's, the CLI's and the Manager's OS)
        run: python -m pytest tests/unit -p no:cacheprovider
      - name: PSScriptAnalyzer on manage.ps1 (errors fail the run)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $all = foreach ($file in "packaging/windows/manage.ps1", "packaging/windows/manager/build.ps1") {
            Invoke-ScriptAnalyzer -Path $file
          }
          $all | Sort-Object Severity, ScriptName, Line | Format-Table Severity, ScriptName, Line, RuleName, Message -AutoSize -Wrap
          $errors = @($all | Where-Object Severity -eq "Error")
          Write-Host "PSScriptAnalyzer: $($errors.Count) error(s), $(@($all).Count - $errors.Count) warning(s)/information"
          if ($errors) { exit 1 }   # warnings are shown, not failed
      - name: Build NetRollout Manager (Windows' own C# compiler)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\manager\build.ps1
          if (-not (Test-Path "packaging\windows\NetRollout Manager.exe")) { exit 1 }
