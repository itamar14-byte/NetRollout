# A release, from a tag: `git tag v1.0.0rc1 && git push origin v1.0.0rc1`.
# Everything is built and tested first; publishing (Docker Hub, then the
# GitHub Release) is the last job, so a failure anywhere publishes nothing.
# Run by hand (Actions -> Release -> Run workflow) it's a dry run on the
# VERSION file: every job but the publishing one.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_IMAGE: itamarweinstein/netrollout
  NGINX_IMAGE: itamarweinstein/netrollout-nginx

jobs:
  check:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: v
        name: The tag is the VERSION file; a pre-release or final
        run: |
          pip install -q packaging
          python - <<'EOF'
          import os, sys
          from packaging.version import Version
          version = open("VERSION", encoding="utf-8").read().strip()
          event, ref = os.environ["GITHUB_EVENT_NAME"], os.environ["GITHUB_REF_NAME"]
          if event == "push" and ref != f"v{version}":
              sys.exit(f"The tag {ref} doesn't match VERSION ({version}): tag v{version}, or change VERSION first.")
          prerelease = Version(version).is_prerelease
          # the release notes: this version's section of CHANGELOG.md - the
          # Release page, the Manager's Update window and `update --check`
          # show them. Once the file exists, a version without a section is
          # refused here, before anything is built.
          try:
              changelog = open("CHANGELOG.md", encoding="utf-8").read()
          except FileNotFoundError:
              changelog = None
          if changelog is not None and not any(
                  line.startswith("## ") and line[3:].split()[:1] in ([version], [f"v{version}"], [f"[{version}]"])
                  for line in changelog.splitlines()):
              sys.exit(f"CHANGELOG.md has no section for {version} (a line '## {version} ...'): "
                       f"write what's in this release first - it becomes the release notes.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
              out.write(f"prerelease={'true' if prerelease else 'false'}\n")
              out.write(f"publish={'true' if event == 'push' else 'false'}\n")
          print(f"NetRollout {version} - {'pre-release' if prerelease else 'final'}, "
                f"{'published at the end' if event == 'push' else 'dry run: nothing published'}")
          EOF

  tests:
    name: Tests
    needs: check
    uses: ./.github/workflows/ci.yml
    with:
      skip_e2e: true      # run below, on the very images it publishes

  images:
    name: Images (built, end-to-end checked)
    needs: [check, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Build both images, stamped with the version
        run: |
          docker build --build-arg VERSION="$VERSION" -t "$APP_IMAGE:$VERSION" .
          docker build -t "$NGINX_IMAGE:$VERSION" deploy/nginx
      - name: The end-to-end checks against these exact images
        env:
          NETROLLOUT_E2E: "1"
          NETROLLOUT_E2E_TAG: ${{ needs.check.outputs.version }}
          NETROLLOUT_E2E_KEEP: "1"
          NETROLLOUT_E2E_DIR: ${{ runner.temp }}/nre2e
        run: python -m pytest tests/e2e -p no:cacheprovider
      - name: On failure - the stack's state and logs
        if: failure()
        working-directory: ${{ runner.temp }}/nre2e
        run: |
          docker compose -p nre2e ps -a || true
          docker compose -p nre2e logs --no-color --tail 200 || true
      - name: Hand the images to the next jobs
        run: docker save "$APP_IMAGE:$VERSION" "$NGINX_IMAGE:$VERSION" | gzip > images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.tar.gz
          retention-days: 7

  linux:
    name: Linux install (the real zip and script)
    needs: [check, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: images
      - name: The release's images (the install uses them instead of pulling)
        run: gunzip -c images.tar.gz | docker load
      - name: The Linux zip
        run: python packaging/build_release.py --version "$VERSION" --linux --out dist/linux
      - name: Install with it, unattended
        run: |
          mkdir -p "$RUNNER_TEMP/install"
          unzip -q "dist/linux/netrollout-$VERSION-linux.zip" -d "$RUNNER_TEMP/install"
          sudo "$RUNNER_TEMP/install/netrollout/bin/install.sh" --yes --no-browser \
            --hostname release-check.netrollout.test --https-port 443 \
            --monitoring y --org-certificate n --timezone UTC
      - name: It runs - healthy, this version
        run: |
          for i in $(seq 1 60); do
            if body=$(curl -fsk --max-time 5 https://127.0.0.1/_netrollout/health); then
              echo "$body"
              echo "$body" | python -c "import json, os, sys; h = json.load(sys.stdin); assert h['version'] == os.environ['VERSION'], h"
              exit 0
            fi
            sleep 5
          done
          echo "NetRollout didn't answer healthy within 5 minutes"; exit 1
      - name: The status command
        run: sudo "$RUNNER_TEMP/install/netrollout/bin/netrollout.sh" status
      - name: On failure - the install's logs
        if: failure()
        run: |
          cd "$RUNNER_TEMP/install/netrollout" || exit 0
          sudo docker compose ps -a || true
          sudo docker compose logs --no-color --tail 200 || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/linux/netrollout-${{ needs.check.outputs.version }}-linux.zip
          retention-days: 7

  windows:
    name: Windows files (Setup, the CLI, the Manager)
    needs: [check, tests]
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Inno Setup 6
        run: choco install innosetup --no-progress -y
      - name: The Manager, Setup and the CLI
        run: python packaging/build_release.py --version "$env:VERSION" --windows --out dist/windows
      - name: The CLI runs and knows its version
        run: |
          $out = & "dist/windows/netrollout-cli-$env:VERSION.exe" --version
          Write-Host $out
          if ($out -notmatch [regex]::Escape($env:VERSION)) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/windows/NetRollout-Setup-${{ needs.check.outputs.version }}.exe
            dist/windows/netrollout-cli-${{ needs.check.outputs.version }}.exe
          retention-days: 7

  publish:
    name: Publish (Docker Hub, then the GitHub Release)
    needs: [check, images, linux, windows]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write          # creates the Release
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: The tested images
        run: gunzip -c artifacts/images/images.tar.gz | docker load
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the images (latest only for a final release)
        run: |
          for image in "$APP_IMAGE" "$NGINX_IMAGE"; do
            docker push "$image:$VERSION"
            if [ "$PRERELEASE" = false ]; then
              docker tag "$image:$VERSION" "$image:latest"
              docker push "$image:latest"
            fi
          done
      - name: The release files and their sums
        run: |
          mkdir release
          cp artifacts/windows/* artifacts/linux/* release/
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: The release notes (this version's CHANGELOG.md section)
        run: |
          python3 - <<'EOF'
          import os, re
          version = os.environ["VERSION"]
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
          except FileNotFoundError:
              raise SystemExit(0)            # no changelog yet: GitHub's generated notes
          heading = re.compile(r"^## \[?v?" + re.escape(version) + r"\]?(\s|$)")
          lines, keep = [], False
          for line in text.splitlines():
              if line.startswith("## "):
                  keep = bool(heading.match(line))
                  continue
              if keep:
                  lines.append(line)
          notes = chr(10).join(lines).strip()
          open("release-notes.md", "w", encoding="utf-8").write(notes + chr(10) if notes else "")
          EOF
      - name: The GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "NetRollout $VERSION" --verify-tag)
          if [ -s release-notes.md ]; then flags+=(--notes-file release-notes.md); else flags+=(--generate-notes); fi
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "v$VERSION" release/* "${flags[@]}"
