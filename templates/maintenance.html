<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maintenance - NetRollout</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ asset('css/maintenance.css') }}">
</head>
<body>
    <main class="box">
        <div class="badge">NetRollout</div>
        <h1>NetRollout is under maintenance</h1>
        <p class="subtitle">{{ info.what | capitalize }}. This usually takes a few minutes -
            nothing can be changed meanwhile, so nothing is lost.</p>
        <div class="progress-line" role="status" aria-live="polite">
            <span class="spinner" aria-hidden="true"></span>
            <span id="progress">{{ info.progress or "Working" }}</span>
        </div>
        <p class="hint">This page reloads by itself when NetRollout is back.</p>
    </main>
<script src="{{ asset('js/maintenance.js') }}"></script>
</body>
</html>
