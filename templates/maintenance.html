<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maintenance — NetRollout</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* The page everyone gets while a database move copies the data
           (src/webapp/maintenance.py). Standalone: nothing here may need the
           database. Reloads by itself when maintenance ends. */
        :root {
            --nr-text:           #e6e6e6;
            --nr-text-secondary: #bdbdbd;
            --nr-text-muted:     #949494;
            --nr-accent:         #00bcd4;
        }
        :focus-visible { outline: 2px solid var(--nr-accent) !important; outline-offset: 2px; }
        body { margin:0; background:#121212; color:#e0e0e0; font-family:'Inter',sans-serif;
               display:flex; align-items:center; justify-content:center; min-height:100vh; }
        .box { text-align:center; max-width:480px; padding:2rem 1rem; }
        .badge { font-family:'JetBrains Mono',monospace; font-size:0.6875rem; letter-spacing:2px;
                 color:var(--nr-text-muted); text-transform:uppercase; margin-bottom:1rem; }
        h1 { font-size:1.1rem; color:var(--nr-text); font-weight:500; margin:0 0 0.5rem; }
        .subtitle { font-size:0.85rem; color:var(--nr-text-secondary); margin:0 0 1.5rem; line-height:1.6; }
        .progress-line { display:flex; align-items:center; justify-content:center; gap:0.6rem;
                         font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:var(--nr-accent);
                         background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07);
                         border-radius:8px; padding:0.65rem 1rem; }
        .spinner { width:12px; height:12px; border:2px solid rgba(0,188,212,0.25);
                   border-top-color:var(--nr-accent); border-radius:50%; animation:spin 0.9s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .spinner { animation:none; } }
        .hint { font-size:0.78rem; color:var(--nr-text-muted); margin-top:1.25rem; }
    </style>
</head>
<body>
    <main class="box">
        <div class="badge">NetRollout</div>
        <h1>NetRollout is under maintenance</h1>
        <p class="subtitle">{{ info.what | capitalize }}. This usually takes a few minutes —
            nothing can be changed meanwhile, so nothing is lost.</p>
        <div class="progress-line" role="status" aria-live="polite">
            <span class="spinner" aria-hidden="true"></span>
            <span id="progress">{{ info.progress or "Working" }}</span>
        </div>
        <p class="hint">This page reloads by itself when NetRollout is back.</p>
    </main>
<script>
(() => {
    const check = () => fetch('/_netrollout/health', {cache: 'no-store',
                               headers: {'X-NR-Background': '1'}})
        .then(r => r.json())
        .then(d => {
            if (!d.maintenance || d.maintenance.state !== 'locked') window.location.reload();
            else if (d.maintenance.progress)
                document.getElementById('progress').textContent = d.maintenance.progress;
        })
        .catch(() => {});   // restarting, or not answering for a moment: keep asking
    setInterval(check, 3000);
})();
</script>
</body>
</html>
