{# The 2FA code entry - six boxes, their style and script - shared by
   otp_enroll.html and otp_verify.html. otp_autofocus: the cursor starts in
   the first box (verify; enrolment starts with the QR code). #}
<style>
  .otp-box {
    width: 44px !important;
    height: 52px;
    padding: 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.35rem;
    border-radius: 8px !important;
    background-color: #161616 !important;
    border-color: #252525 !important;
    color: #00bcd4 !important;
    text-align: center;
  }
  .otp-box:focus {
    border-color: #00bcd4 !important;
    box-shadow: 0 0 0 3px rgba(0,188,212,0.15) !important;
    background-color: #1a1a1a !important;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%       { transform: translateX(-6px); }
    40%       { transform: translateX(6px); }
    60%       { transform: translateX(-4px); }
    80%       { transform: translateX(4px); }
  }
  .shake { animation: shake 0.4s ease; }
</style>

<script>
  const boxes = document.querySelectorAll(".otp-box");
  const codeInput = document.getElementById("codeInput");
  const submitBtn = document.getElementById("submitBtn");
  const otpBoxes = document.getElementById("otpBoxes");
{% if otp_autofocus %}
  boxes[0].focus();
{% endif %}
  // --- OTP box navigation ---
  boxes.forEach((box, i) => {
    box.addEventListener("input", () => {
      box.value = box.value.replace(/[^0-9]/g, "");
      if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
      syncCode();
    });
    box.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !box.value && i > 0) {
        boxes[i - 1].focus();
        boxes[i - 1].value = "";
        syncCode();
      }
    });
    box.addEventListener("paste", (e) => {
      e.preventDefault();
      const pasted = e.clipboardData.getData("text").replace(/[^0-9]/g, "").slice(0, 6);
      pasted.split("").forEach((char, idx) => {
        if (boxes[idx]) boxes[idx].value = char;
      });
      const next = Math.min(pasted.length, boxes.length - 1);
      boxes[next].focus();
      syncCode();
    });
  });

  function syncCode() {
    const code = Array.from(boxes).map(b => b.value).join("");
    codeInput.value = code;
    submitBtn.disabled = code.length !== 6;
  }

  // --- Flash shake on page load if there was an error ---
  {% if get_flashed_messages() %}
  document.addEventListener("DOMContentLoaded", () => {
    otpBoxes.classList.add("shake");
    otpBoxes.addEventListener("animationend", () => otpBoxes.classList.remove("shake"), { once: true });
  });
  {% endif %}

  // --- TOTP 30-second countdown timer ---
  const circle = document.getElementById("timerCircle");
  const timerText = document.getElementById("timerText");
  const circumference = 2 * Math.PI * 22;

  function updateTimer() {
    const now = Math.floor(Date.now() / 1000);
    const secondsLeft = 30 - (now % 30);
    const fraction = secondsLeft / 30;

    timerText.textContent = secondsLeft;
    circle.style.strokeDashoffset = circumference * (1 - fraction);

    if (secondsLeft <= 10) {
      circle.style.stroke = "#dc3545"; // red
    } else if (secondsLeft <= 20) {
      circle.style.stroke = "#ffc107"; // amber
    } else {
      circle.style.stroke = "#28a745"; // green
    }
  }

  updateTimer();
  setInterval(updateTimer, 1000);
</script>
