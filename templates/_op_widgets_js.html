{# The operator pages' shared widgets - their scripts, in <head> so a page's
   script can call them wherever it sits: reachability (nrCheckReachability,
   nrSetReach, ...), the assign board (nrAssignBoard), autoSlug, the icon
   picker (initIconPicker). #}
<script>
// The CSRF token every request the page's scripts send carries (X-CSRFToken).
const CSRF_TOKEN = "{{ csrf_token() }}";

// ── Reachability (shared by New Rollout and Inventory) ─────────────────────
// Defined in <head> so page scripts can call it wherever they sit in the
// body (New Rollout's runs inside the content block, before the footer).
// Probed from the NetRollout server (ip:port), cached ~60s server-side;
// refresh=true re-probes.

async function nrCheckReachability(deviceIds, refresh = false) {
    if (!deviceIds.length) return {};
    try {
        const resp = await fetch('/inventory/reachability', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN},
            body: JSON.stringify({device_ids: deviceIds, refresh})
        });
        const data = await resp.json();
        return data.status === 'ok' ? data.statuses : {};
    } catch (_) {
        return {};
    }
}

function nrAgo(iso) {
    const secs = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
    if (secs < 60) return secs + 's ago';
    return Math.round(secs / 60) + 'm ago';
}

// Render one indicator element: state 'checking' | 'up' | 'down' | 'unknown'
function nrSetReach(el, status) {
    const state = !status ? 'unknown' : (status.reachable ? 'up' : 'down');
    const icon  = {up: 'bi-circle-fill', down: 'bi-x-circle-fill',
                   unknown: 'bi-question-circle'}[state];
    const label = {up: 'Reachable', down: 'Not reachable',
                   unknown: 'Reachability unknown'}[state];
    const when  = status ? ' · checked ' + nrAgo(status.checked_at) : '';
    el.className = 'reach reach--' + state;
    el.innerHTML = '<i class="bi ' + icon + '"></i>';
    el.setAttribute('aria-label', label);
    el.title = label + ' from NetRollout' + when;
    return state;
}

function nrReachChecking(el) {
    el.className = 'reach reach--checking';
    el.innerHTML = '<i class="bi bi-arrow-repeat"></i>';
    el.setAttribute('aria-label', 'Checking reachability');
    el.title = 'Checking reachability…';
}

// ── NrSelect (the searchable dropdowns): open / close and the search ─────
// What every NrSelect does alike: the trigger opens and closes it, typing in
// its search filters (filter(q), the caller's), a click outside closes it,
// and so does its modal hiding (modal: that element; none - stays open).
// Returns {open, close, wire(option, pick)}: wire makes a click on an
// option call pick(option).
function nrSelectShell(container, filter, modal) {
    const trigger = container.querySelector('.nr-select-trigger');
    const search  = container.querySelector('.nr-select-search');

    function open()  { container.classList.add('open'); search.focus(); }
    function close() { container.classList.remove('open'); search.value = ''; filter(''); }

    trigger.addEventListener('click', e => {
        e.stopPropagation();
        container.classList.contains('open') ? close() : open();
    });
    search.addEventListener('input', () => filter(search.value));
    search.addEventListener('click', e => e.stopPropagation());
    return {
        open, close,
        wire(option, pick) {
            option.addEventListener('click', e => { e.stopPropagation(); pick(option); });
        },
        // the outside-click / modal listeners, after the options are wired
        // (the order the controllers had)
        listen() {
            document.addEventListener('click', close);
            if (modal) modal.addEventListener('hidden.bs.modal', close);
        },
    };
}

// ── Assign board ──
// Two columns inside a device-assignment modal: data-col="in" (assigned) and
// data-col="out" (available). Moves are staged locally; the caller reads
// added()/removed() on save. Drag a card across, or click / Enter to move it.
// opts: devices [{id,label,ip,device_type,is_global}], assigned [ids],
//       pool [ids], logos {device_type: url}, meta(d) -> text,
//       warn(d, isAssigned) -> text|null, locked(d, isAssigned) -> reason|null
//       (a locked card can't move), emptyIn, emptyOut() -> text,
//       legend (element: key for the card edges, filled while changes are staged),
//       onChange(board)
function nrAssignBoard(root, opts) {
    const byId    = new Map(opts.devices.map(d => [d.id, d]));
    const initial = new Set(opts.assigned.filter(id => byId.has(id)));
    const current = new Set(initial);
    const order   = [...initial, ...opts.pool.filter(id => byId.has(id) && !initial.has(id))];
    let landed = null;

    function card(d) {
        const isIn  = current.has(d.id);
        const state = isIn && !initial.has(d.id) ? ' is-added'
                    : !isIn && initial.has(d.id) ? ' is-removed' : '';
        const logo  = (opts.logos || {})[d.device_type];
        const icon  = logo
            ? `<img alt="" src="${nrEscape(logo)}" onerror="this.replaceWith(Object.assign(document.createElement('i'),{className:'bi bi-router'}))">`
            : '<i class="bi bi-router"></i>';
        const meta  = opts.meta ? opts.meta(d) : '';
        const warn  = opts.warn ? opts.warn(d, isIn) : null;
        const lock  = lockReason(d, isIn);
        const verb  = isIn ? 'Unassign' : 'Assign';
        return `
        <div class="nr-board-card${state}${lock ? ' is-locked' : ''}${d.id === landed ? ' is-landing' : ''}"
             draggable="${lock ? 'false' : 'true'}" tabindex="0" role="button" data-id="${nrEscape(d.id)}"
             ${lock ? 'aria-disabled="true"' : ''}
             aria-label="${lock ? nrEscape(d.label) + ': ' + nrEscape(lock) : verb + ' ' + nrEscape(d.label) + ' (' + nrEscape(d.ip) + ')'}"
             title="${lock ? nrEscape(lock) : verb + ': drag or click'}">
            <div class="nr-board-vendor">${icon}</div>
            <div class="nr-board-name">
                <span class="nr-board-label">${nrEscape(d.label)}</span>
                <span class="nr-board-ip">${nrEscape(d.ip)}</span>
            </div>
            ${d.is_global ? '<span class="nr-global-badge" title="Global device — shared by an administrator"><i class="bi bi-globe2"></i>GLOBAL</span>' : ''}
            ${warn ? `<i class="bi bi-exclamation-triangle-fill nr-board-warn" title="${nrEscape(warn)}"></i>` : ''}
            ${meta ? `<span class="nr-board-meta" title="${nrEscape(meta)}">${nrEscape(meta)}</span>` : ''}
            ${lock ? '<i class="bi bi-lock-fill nr-board-lock"></i>'
                   : `<i class="bi ${isIn ? 'bi-arrow-right' : 'bi-arrow-left'} nr-board-move"></i>`}
        </div>`;
    }

    const lockReason = (d, isIn) => opts.locked ? opts.locked(d, isIn) : null;

    function renderCol(key) {
        const col  = root.querySelector(`[data-col="${key}"]`);
        const list = col.querySelector('.nr-board-list');
        const devs = order.filter(id => (key === 'in') === current.has(id)).map(id => byId.get(id));
        col.querySelector('.nr-board-count').textContent = devs.length;
        if (!devs.length) {
            const text = key === 'in' ? opts.emptyIn : opts.emptyOut();
            list.innerHTML = `<p class="nr-board-empty">${nrEscape(text)}</p>`;
            return;
        }
        // Split into Global / My Devices only when both groups are non-empty
        const globals = devs.filter(d => d.is_global), mine = devs.filter(d => !d.is_global);
        const head = (icon, name, n) =>
            `<div class="nr-section-head"><i class="bi ${icon}"></i>${name}<span class="nr-section-count">${n}</span></div>`;
        list.innerHTML = globals.length && mine.length
            ? head('bi-globe2', 'Global Devices', globals.length) + globals.map(card).join('') +
              '<div style="height:0.6rem;"></div>' +
              head('bi-hdd-stack', 'My Devices', mine.length) + mine.map(card).join('')
            : devs.map(card).join('');
    }

    function render() {
        renderCol('in');
        renderCol('out');
        if (opts.legend) {
            const key = (kind, text) =>
                `<span><span class="nr-board-swatch nr-board-swatch--${kind}"></span>${text}</span>`;
            opts.legend.innerHTML =
                (board.added().length   ? key('added', 'to assign')     : '') +
                (board.removed().length ? key('removed', 'to unassign') : '');
        }
        landed = null;
        if (opts.onChange) opts.onChange(board);
    }

    const board = {
        added:   () => order.filter(id => current.has(id) && !initial.has(id)),
        removed: () => order.filter(id => !current.has(id) && initial.has(id)),
        isAssigned: id => current.has(id),
        move(id, toIn, focus = false) {
            if (!byId.has(id) || current.has(id) === toIn) return;
            if (lockReason(byId.get(id), current.has(id))) return;
            toIn ? current.add(id) : current.delete(id);
            landed = id;
            render();
            if (focus) root.querySelector(`.nr-board-card[data-id="${CSS.escape(id)}"]`)?.focus();
        },
    };

    // Listeners are attached once per root and delegate to the live board
    root._nrBoard = board;
    if (!root._nrBoardWired) {
        root._nrBoardWired = true;
        const cardOf = e => e.target.closest('.nr-board-card');
        const toggle = c => root._nrBoard.move(c.dataset.id, !root._nrBoard.isAssigned(c.dataset.id), true);
        root.addEventListener('click', e => { const c = cardOf(e); if (c) toggle(c); });
        root.addEventListener('keydown', e => {
            const c = cardOf(e);
            if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(c); }
        });
        root.addEventListener('dragstart', e => {
            const c = cardOf(e);
            if (!c) return;
            c.classList.add('is-dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', c.dataset.id);
        });
        root.addEventListener('dragend', e => cardOf(e)?.classList.remove('is-dragging'));
        root.querySelectorAll('[data-col]').forEach(col => {
            col.addEventListener('dragover', e => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                col.classList.add('drag-over');
            });
            col.addEventListener('dragleave', e => {
                if (!col.contains(e.relatedTarget)) col.classList.remove('drag-over');
            });
            col.addEventListener('drop', e => {
                e.preventDefault();
                col.classList.remove('drag-over');
                root._nrBoard.move(e.dataTransfer.getData('text/plain'), col.dataset.col === 'in');
            });
        });
    }
    render();
    return board;
}

// "Save (+2 / −1)", or a disabled plain "Save" when nothing changed
function nrBoardSaveLabel(btn, board) {
    const a = board.added().length, r = board.removed().length;
    const parts = [a ? '+' + a : '', r ? '−' + r : ''].filter(Boolean);
    btn.disabled  = !parts.length;
    btn.innerHTML = '<i class="bi bi-check-lg me-1"></i>Save' +
        (parts.length ? ' <span class="nr-board-delta">(' + parts.join(' / ') + ')</span>' : '');
}

// ── Shared helpers ────────────────────────────────────────────────────────────
function autoSlug(labelId, nameId) {
    const nameEl = document.getElementById(nameId);
    if (!nameEl) return;
    const label = document.getElementById(labelId).value;
    nameEl.value = label.toLowerCase().trim().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
}

function initIconPicker(previewId, inputId) {
    const preview = document.getElementById(previewId);
    const input   = document.getElementById(inputId);
    if (!preview || !input) return;

    const inputGroup = input.closest('.input-group') || input.parentElement;
    inputGroup.style.position = 'relative';

    const panel = document.createElement('div');
    panel.className = 'icon-picker-panel';

    const search = document.createElement('input');
    search.type        = 'text';
    search.className   = 'icon-picker-search';
    search.placeholder = 'Search icons…';

    const grid = document.createElement('div');
    grid.className = 'icon-picker-grid';

    function renderGrid(q) {
        grid.innerHTML = '';
        const filtered = q
            ? ICON_PICKER_ICONS.filter(i => i.includes(q.toLowerCase()))
            : ICON_PICKER_ICONS;
        filtered.forEach(name => {
            const opt = document.createElement('div');
            opt.className = 'icon-picker-opt' + (input.value === name ? ' selected' : '');
            opt.title = name;
            opt.innerHTML = `<i class="bi ${name}"></i>`;
            opt.onclick = () => {
                input.value = name;
                preview.className = 'bi ' + name;
                grid.querySelectorAll('.icon-picker-opt').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
                panel.classList.remove('open');
            };
            grid.appendChild(opt);
        });
    }

    search.oninput = () => renderGrid(search.value);
    panel.appendChild(search);
    panel.appendChild(grid);
    inputGroup.appendChild(panel);

    preview.parentElement.style.cursor = 'pointer';
    preview.parentElement.onclick = (e) => {
        e.stopPropagation();
        const isOpen = panel.classList.contains('open');
        document.querySelectorAll('.icon-picker-panel.open').forEach(p => p.classList.remove('open'));
        if (!isOpen) {
            renderGrid('');
            search.value = '';
            panel.classList.add('open');
            setTimeout(() => search.focus(), 50);
        }
    };

    input.oninput = () => { preview.className = 'bi ' + input.value; };
    document.addEventListener('click', () => panel.classList.remove('open'));
}
</script>
