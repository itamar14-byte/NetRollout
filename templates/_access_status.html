{# What nginx last did and the certificate in use (proxy_config.overview) —
   System Settings → Access and Server Management → TLS Certificate.
   nrAccessStatus(el, data) fills el; nrNginxLine(nginx) is one line. #}
<style>
  .access-status { font-family: 'JetBrains Mono', monospace; font-size: 0.76rem; line-height: 1.7;
                   background: #151515; border: 1px solid #242424; border-radius: 8px;
                   padding: 0.6rem 0.85rem; margin-top: 0.75rem; }
  .access-status .k { color: var(--nr-text-muted); display: inline-block; min-width: 7.5rem; }
  .access-status .ok { color: #81c784; } .access-status .fail { color: #ef9a9a; }
  .access-status .warn { color: #ffcc80; } .access-status .dim { color: var(--nr-text-muted); }
</style>
<script>
(() => {
  const esc = t => String(t ?? '').replace(/[&<>"']/g, c =>
    ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString(); };
  const day = d => isNaN(d) ? '' : d.toLocaleDateString();

  window.nrNginxLine = n => {
    if (!n) return '<span class="dim">no NetRollout nginx reports here — with your own reverse proxy, check it there</span>';
    const at = n.time ? ` <span class="dim">· ${esc(when(n.time))}</span>` : '';
    if (n.state === 'applied') return `<span class="ok">✓ applied</span> <span class="dim">${esc(n.message)}</span>${at}`;
    if (n.state === 'rejected')
      return `<span class="fail">✗ rejected: ${esc(n.message || 'no message')}</span>${at}<br>` +
             '<span class="k"></span><span class="dim">nginx keeps serving the last good site</span>';
    return `<span class="warn">? ${esc(n.state)}</span> <span class="dim">— check <code>netrollout status</code> on the server</span>`;
  };

  window.nrAccessStatus = (el, a) => {
    const rows = [`<span class="k">nginx</span>${nrNginxLine(a.nginx)}`];
    const c = a.certificate;
    if (!c) {
      rows.push('<span class="k">certificate</span><span class="fail">✗ none in the certs folder</span>');
    } else {
      const end = c.not_after ? new Date(c.not_after) : null;
      const left = end ? Math.floor((end - Date.now()) / 86400000) : null;
      rows.push(`<span class="k">certificate</span>${c.selfsigned ? 'self-signed' : "your organisation's"}` +
        (end ? ` <span class="dim">· valid until ${esc(day(end))} (${left} days)</span>` : ''));
      rows.push(`<span class="k">covers</span>${esc(c.names.join(', ') || '—')}`);
      for (const o of c.old_names)
        rows.push(`<span class="k"></span><span class="dim">${esc(o.name)}: previous hostname, ` +
                  `leaves on ${esc(day(new Date(o.until * 1000)))}</span>`);
      for (const p of c.problems) rows.push(`<span class="k"></span><span class="fail">✗ ${esc(p)}</span>`);
      for (const w of c.warnings) rows.push(`<span class="k"></span><span class="warn">⚠ ${esc(w)}</span>`);
    }
    el.innerHTML = rows.join('<br>');
  };
})();
</script>
