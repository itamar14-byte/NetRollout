{# The signed-in user's menu, top right: My Account, Logout. (An admin moves
   between the views with the top bar's switch, _view_switch.html.) #}
<div class="dropdown">
    <button class="btn nr-user-btn dropdown-toggle" type="button"
            data-bs-toggle="dropdown" aria-expanded="false" aria-label="Account menu: {{ current_user.username }}">
        <i class="bi bi-person-circle nr-user-icon" aria-hidden="true"></i><span class="nr-user-name">{{ current_user.username }}</span>
    </button>
    <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="{{ url_for('auth.account') }}">
            <i class="bi bi-person me-2 nr-faint"></i>My Account
        </a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="{{ url_for('auth.logout') }}">
            <i class="bi bi-box-arrow-right me-2 nr-faint"></i>Logout
        </a></li>
    </ul>
</div>
