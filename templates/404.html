<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found — NetRollout</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        /* A page that isn't there, answered the way a router answers a command
           it doesn't know (hooks.register_handlers). Standalone: signed in or
           not, nothing here needs the database. */
        :root {
            --nr-text:           #e6e6e6;
            --nr-text-secondary: #bdbdbd;
            --nr-text-muted:     #949494;
            --nr-accent:         #00bcd4;
            --nr-danger:         #ff6b6b;
        }
        :focus-visible { outline: 2px solid var(--nr-accent) !important; outline-offset: 2px; }
        *, *::before, *::after { box-sizing: border-box; }
        body { margin:0; background:#121212; color:#e0e0e0; font-family:'Inter',sans-serif;
               display:flex; align-items:center; justify-content:center; min-height:100vh; padding:1rem; }
        body::before { content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
                       background-image: radial-gradient(rgba(255,255,255,0.045) 1px, transparent 1px);
                       background-size: 22px 22px; }
        .wrap { width:100%; max-width:640px; }
        .term { background:#0b0d0e; border:1px solid rgba(255,255,255,0.09); border-radius:10px;
                box-shadow: 0 18px 50px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,188,212,0.06);
                overflow:hidden; }
        .bar { display:flex; align-items:center; gap:0.45rem; padding:0.6rem 0.85rem;
               background:#181b1d; border-bottom:1px solid rgba(255,255,255,0.06); }
        .dot { width:11px; height:11px; border-radius:50%; background:#3a3f42; }
        .dot.r { background:#ff5f57; } .dot.y { background:#febc2e; } .dot.g { background:#28c840; }
        .bar-title { flex:1; text-align:center; margin-right:2.6rem; font-family:'JetBrains Mono',monospace;
                     font-size:0.72rem; letter-spacing:0.5px; color:var(--nr-text-muted); }
        pre { margin:0; padding:1.1rem 1.2rem 1.25rem; font-family:'JetBrains Mono',monospace;
              font-size:0.84rem; line-height:1.65; color:#cfd8dc; white-space:pre; overflow-x:auto; }
        .prompt { color:var(--nr-accent); }
        .cmd { color:var(--nr-text); }
        .caret { color:var(--nr-danger); font-weight:700; }
        .err { color:var(--nr-danger); }
        .muted { color:var(--nr-text-muted); }
        .cursor { display:inline-block; width:0.6em; height:1.05em; vertical-align:-0.15em;
                  background:var(--nr-accent); animation:blink 1.1s steps(1) infinite; }
        @keyframes blink { 50% { opacity:0; } }
        @media (prefers-reduced-motion: reduce) { .cursor { animation:none; } }
        .below { display:flex; align-items:center; justify-content:space-between; gap:1rem;
                 flex-wrap:wrap; margin-top:1rem; padding:0 0.15rem; }
        .code { font-family:'JetBrains Mono',monospace; font-size:0.7rem; letter-spacing:2px;
                text-transform:uppercase; color:var(--nr-text-muted); }
        a.home { font-size:0.85rem; color:#0d1416; background:var(--nr-accent); text-decoration:none;
                 padding:0.5rem 1rem; border-radius:6px; font-weight:500; }
        a.home:hover { background:#26c6da; }
    </style>
</head>
<body>
    <main class="wrap">
        <div class="term" role="img" aria-label="Page not found: {{ path }}">
            <div class="bar" aria-hidden="true">
                <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
                <span class="bar-title">netrollout — console</span>
            </div>
<pre aria-hidden="true"><span class="prompt">NetRollout&gt;</span> <span class="cmd">show page {{ path }}</span>
{{ " " * 22 }}<span class="caret">^</span>
<span class="err">% Invalid input detected at '^' marker.</span>

<span class="prompt">NetRollout&gt;</span> <span class="cmd">show route {{ path }}</span>
<span class="err">% Network not in table</span>

<span class="prompt">NetRollout&gt;</span> <span class="cursor"></span></pre>
        </div>
        <div class="below">
            <span class="code">404 · this page isn't in the routing table</span>
            {% if signed_in %}
            <a class="home" href="{{ url_for('jobs.dashboard') }}">Back to the dashboard</a>
            {% else %}
            <a class="home" href="{{ url_for('auth.home') }}">Sign in</a>
            {% endif %}
        </div>
    </main>
</body>
</html>
