{# The theme rules every skeleton (base, operator_base, admin) shares: check
   boxes, tables, alerts, the close button, modals. Included inside each
   skeleton's <style>, where these rules sat - the order matters (the CSS
   cascade), so a rule moves in or out only together with its neighbours. #}
        /* ── Form check ── */
        .form-check-input {
            background-color: #1e1e1e !important;
            border-color: #2a2a2a !important;
        }
        .form-check-input:checked {
            background-color: #00bcd4 !important;
            border-color: #00bcd4 !important;
        }
        .form-check-label { color: var(--nr-text-muted) !important; font-size: 0.88rem; }


        /* ── Tables ── */
        .table { color: #ccc !important; }
        .table > :not(caption) > * > * { background-color: transparent !important; color: #ccc !important; }
        .table-hover > tbody > tr:hover > * { background-color: rgba(0,188,212,0.03) !important; color: #e0e0e0 !important; }
        .table thead th {
            border-bottom: 1px solid #222 !important;
            color: var(--nr-text-muted) !important;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
            padding-bottom: 0.75rem;
        }
        .table td { border-color: #1a1a1a !important; }

        /* ── Alerts ── */
        .alert {
            border-radius: 8px !important;
            font-family: 'Inter', sans-serif;
            font-size: 0.86rem;
            border-width: 1px !important;
        }
        .alert-info    { background-color: rgba(0,188,212,0.07)  !important; color: #80deea !important; border-color: rgba(0,188,212,0.15)  !important; }
        .alert-danger  { background-color: rgba(239,83,80,0.07)  !important; color: #ef9a9a !important; border-color: rgba(239,83,80,0.15)  !important; }
        .alert-success { background-color: rgba(76,175,80,0.07)  !important; color: #a5d6a7 !important; border-color: rgba(76,175,80,0.15)  !important; }
        .alert-warning { background-color: rgba(255,193,7,0.07)  !important; color: #ffe082 !important; border-color: rgba(255,193,7,0.15)  !important; }
        .btn-close { filter: invert(1) brightness(0.5); }

        /* ── Modals ── */
        .modal-content {
            background-color: #1a1a1a !important;
            border: 1px solid #222 !important;
            color: #e0e0e0 !important;
            border-radius: 12px !important;
        }
        .modal-header { border-color: #222 !important; padding: 1.25rem 1.5rem; }
        .modal-footer { border-color: #222 !important; padding: 1rem 1.5rem; }
        .modal-body { padding: 1.5rem; }
        .modal-title { color: #e0e0e0 !important; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 1rem; }
