{# The delete confirmation: "IRREVERSIBLE ACTION", the item's name in
   #name_id (the page's script fills it and the form's action), Cancel /
   Delete. #}
{% macro delete_modal(title, prompt, name_id, name_color, note) %}
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width:420px;">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <div class="nr-badge" style="margin-bottom:0.3rem; border-color:rgba(239,83,80,0.4); color:#ef9a9a;">IRREVERSIBLE ACTION</div>
                    <h5 class="modal-title" style="color:#ef9a9a;">{{ title }}</h5>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p style="font-size:0.88rem; color:#ccc; margin-bottom:0.4rem;">
                    {{ prompt }}
                    <span id="{{ name_id }}" style="font-family:'JetBrains Mono',monospace; color:{{ name_color }}; font-weight:700;"></span>?
                </p>
                <p style="font-size:0.82rem; color:var(--nr-text-muted); margin-bottom:0;">
                    {{ note }}
                </p>
            </div>
            <div class="modal-footer">
                <form method="POST" id="deleteForm" action="">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-danger btn-sm">
                        <i class="bi bi-trash3 me-1"></i>Delete
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endmacro %}
