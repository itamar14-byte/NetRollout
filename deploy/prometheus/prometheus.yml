global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # The app directly, inside the compose network: nginx answers /metrics
  # with 404 so the metrics are never public
  - job_name: "netrollout"
    static_configs:
      - targets: ["app:8080"]
    metrics_path: /metrics
