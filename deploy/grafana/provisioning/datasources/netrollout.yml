apiVersion: 1

# The NetRollout database data source isn't provisioned: it follows a
# database move, so grafana-setup keeps it through Grafana's API (uid
# cfjxoedixn7r4d, deploy/grafana/setup.py). The provisioned one of earlier
# versions is removed by name; the API's has another name, so it stays.
deleteDatasources:
  - name: postgresql
    orgId: 1

datasources:
  - name: prometheus
    type: prometheus
    uid: efjxnznhhslc0a
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
    editable: false

  - name: loki
    type: loki
    uid: bfjxobrgrah34b
    access: proxy
    url: http://loki:3100
    editable: false
