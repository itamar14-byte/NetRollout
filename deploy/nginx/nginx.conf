worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format    main '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';
    access_log    /var/log/nginx/access.log main;   # → docker logs
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # Docker's DNS, re-asked every 10 s: a restarted app (new IP) is found
    # again instead of leaving nginx on a dead address (502)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The site, rendered from site.conf.template by netrollout-render.sh
    include /etc/nginx/netrollout/active/*.conf;
}
