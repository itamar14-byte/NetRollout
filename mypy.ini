# Type checking for NetRollout's own code (the gate for its type hints):
#   python -m mypy            (repo root, dev venv)
# Every function is typed (disallow_untyped_defs); the bodies of all of them
# are checked. Tests aren't typed - their names and docstrings say what they
# check. Third-party packages without type information are taken as Any.
[mypy]
python_version = 3.12
files = src, tools, deploy/grafana/setup.py
exclude = (?x)(
    ^src/db/alembic/versions/   # generated migrations
  )
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
ignore_missing_imports = True
explicit_package_bases = True
