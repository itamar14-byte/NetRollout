# Type checking for NetRollout's own code (the gate for its type hints):
#   python -m mypy            (repo root, dev venv)
# Every function is typed (disallow_untyped_defs); the bodies of all of them
# are checked. Tests aren't typed - their names and docstrings say what they
# check. Third-party packages without type information are taken as Any.
[mypy]
python_version = 3.12
files = src, tools, deploy/grafana/setup.py
exclude = (?x)(
    ^src/db/alembic/versions/   # generated migrations
  )
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
ignore_missing_imports = True
explicit_package_bases = True

# Packages typeshed has stubs for, not installed (the global setting above
# doesn't cover those)
[mypy-waitress.*]
ignore_missing_imports = True

# Done (every function typed and documented) - kept so:
[mypy-src.db.*]
disallow_untyped_defs = True

[mypy-src.core,src.platforms,src.cli,src.validation,src.input_parser,src.logging_utils,src.orchestration,src.job_store,src.reachability]
disallow_untyped_defs = True

[mypy-src.runtime,src.encryption,src.certs,src.passwords,src.ldap_auth,src.site_env,src.backup,src.setup.*,tools.*,deploy.*]
disallow_untyped_defs = True

[mypy-src.webapp,src.webapp.__main__,src.webapp.accounts,src.webapp.backup_schedule,src.webapp.db_move,src.webapp.extensions,src.webapp.flask_app,src.webapp.lifecycle,src.webapp.maintenance,src.webapp.port_apply,src.webapp.proxy_config,src.webapp.retention,src.webapp.setup,src.webapp.startup,src.webapp.utils]
disallow_untyped_defs = True
